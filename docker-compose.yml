# Email Signature Generator - MySQL Database Only
#
# This docker-compose file runs ONLY the MySQL database in Docker.
# The Laravel application should be run LOCALLY on your machine.
#
# Usage:
#   1. Start MySQL: docker-compose up -d
#   2. Run Laravel locally: php artisan serve --port=8080
#
# DO NOT try to build a Docker image from this project.
# There is no Dockerfile and it's not needed.

# Email Signature Generator - Docker Compose
# This file ONLY runs MySQL in Docker
# Laravel application runs locally with: php artisan serve --port=8080

services:
  mysql:
    image: mysql:8.0 # Official MySQL image - supports AMD64 (Windows/Intel) and ARM64 (Mac M1/M2)
    container_name: email_signature_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: email_signature_db
    ports:
      - "3306:3306" # MySQL port accessible at localhost:3306
    volumes:
      - mysql_data:/var/lib/mysql # Persistent storage for database
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      timeout: 20s
      retries: 10
      interval: 5s

volumes:
  mysql_data: # Docker volume for MySQL data persistence
