version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: email_signature_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-email_signature_db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-signature-generator:latest
    container_name: email_signature_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: email_signature_db
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    command: >
      sh -c "
        composer install --no-interaction --optimize-autoloader &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        php artisan db:seed --class=TemplateSeeder --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

volumes:
  mysql_data:
